[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.9.1", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "rust_decimal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = { version = "1.36", features = ["serde-with-float"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "gzip", "deflate", "brotli"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
thiserror = "2.0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
utoipa = { version = "6", features = ["axum_extras", "chrono", "decimal_float"] }
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }